<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파란 다이얼 타이머</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 25% 10%,#e3e8dc,#c5cdbf);display:grid;place-items:center;font-family:'Malgun Gothic',sans-serif;color:#56584b;padding:24px}main{text-align:center;width:min(430px,100%)}h1{font-size:17px;font-weight:400;letter-spacing:2px;margin:0 0 12px}.intro{font-size:12px;color:#73776a;margin-bottom:36px}.device{position:relative;background:linear-gradient(110deg,#f8eed1,#e9d7a8);padding:24px 19px 21px;border-radius:15px;box-shadow:12px 13px 0 #c6b38c,18px 28px 35px #40493235,inset 2px 2px 5px #fff9e4;border:1px solid #e7d9b7}.device:before{content:'';position:absolute;top:-8px;left:35px;width:90px;height:9px;border-radius:4px 4px 0 0;background:#426886;box-shadow:0 -2px 0 #7895a9}.device:after{content:'';position:absolute;top:-7px;right:32px;width:43px;height:8px;border-radius:50%;background:#dfbb65}svg{width:100%;display:block;touch-action:none;user-select:none;cursor:grab;filter:drop-shadow(0 2px 2px #817a5b22)}svg:active{cursor:grabbing}text{font-family:'Malgun Gothic',sans-serif;fill:#72776c}.display{font-size:28px;letter-spacing:3px;font-variant-numeric:tabular-nums;margin:34px 0 8px;color:#3d5667}#status{font-size:12px;min-height:20px;margin:8px 0 21px}.buttons{display:flex;gap:10px}button{font:inherit;font-size:13px;border:1px solid #aab3a0;background:#eff0e5;color:#515e50;border-radius:10px;cursor:pointer;padding:13px 17px;flex:1}button:hover{filter:brightness(.96)}#start{background:#416783;color:#fff;border-color:#416783;flex:2}button:focus-visible,svg:focus-visible{outline:3px solid #7f9fb6;outline-offset:5px}.presets{display:flex;gap:8px;margin-top:12px}.presets button{padding:9px}.hint{font-size:11px;margin-top:25px;color:#72796b}@media(max-width:400px){.device{padding:16px 12px}main{max-width:320px}}.settings{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0;font-size:13px}.settings input{width:65px;padding:10px;border:1px solid #aab3a0;border-radius:9px;background:#faf9ef;color:#3d5667;font:inherit;text-align:center}.settings button{flex:0;padding:10px 15px}</style><main><h1>작은 시간, 차분한 집중</h1><p class="intro">파란 조각이 줄어드는 만큼, 할 일도 조금씩.</p><div class="device"><svg id="dial" viewBox="0 0 360 360" tabindex="0" role="slider" aria-label="타이머 시간, 방향키로 1분씩 조절" aria-valuemin="0" aria-valuemax="60" aria-valuenow="15"><defs><radialGradient id="face"><stop stop-color="#fffef4"/><stop offset="1" stop-color="#eee9d7"/></radialGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#527ba2"/><stop offset="1" stop-color="#2c507c"/></linearGradient><radialGradient id="knob"><stop stop-color="#f7d174"/><stop offset="1" stop-color="#dcb35d"/></radialGradient></defs><circle cx="180" cy="180" r="175" fill="#c9c3ac"/><circle cx="180" cy="180" r="172" fill="url(#face)"/><path id="sector" fill="url(#blue)"/><g id="ticks"></g><text x="180" y="244" text-anchor="middle" font-size="11" letter-spacing="2">SLOW MOMENT</text><text x="180" y="261" text-anchor="middle" font-size="8">나만의 속도로</text><g id="handle"><circle cx="180" cy="180" r="22" fill="#9e8033" opacity=".18" transform="translate(2 3)"/><circle cx="180" cy="180" r="21" fill="url(#knob)"/><rect x="174" y="151" width="12" height="49" rx="6" fill="#efc66b" stroke="#d7ad54"/><path d="M178 156v35" stroke="#ffe3a0" stroke-width="2" stroke-linecap="round"/></g></svg></div><div id="time" class="display" role="timer">15:00</div><p id="status" role="status">눈금판을 눌러 시간을 맞춰 주세요</p><div class="settings"><input id="setMin" type="number" min="0" max="60" step="1" value="15" aria-label="설정할 분"><span>분</span><input id="setSec" type="number" min="0" max="59" step="1" value="0" aria-label="설정할 초"><span>초</span><button id="apply">설정</button></div><div class="buttons"><button id="start">시작하기</button><button id="reset">초기화</button></div><div class="presets"><button data-min="5">5분</button><button data-min="15">15분</button><button data-min="25">25분</button><button data-min="60">60분</button></div><p class="hint">분·초 입력 후 설정 · 최대 60분 · 완료 알림음</p></main><script>
const $=id=>document.getElementById(id);let total=900000,left=total,running=false,end=0,interval,audio,drag=false;
for(let i=0;i<60;i++){const a=i*Math.PI/30,x=Math.sin(a),y=-Math.cos(a),r=i%5===0?138:147;const line=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:180+x*r,y1:180+y*r,x2:180+x*154,y2:180+y*154,stroke:'#8d927f','stroke-width':i%5===0?1.6:.8}).forEach(([k,v])=>line.setAttribute(k,v));$('ticks').append(line);if(i%5===0){const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',180+x*163);t.setAttribute('y',184+y*163);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','10');t.textContent=i===0?'0':i;$('ticks').append(t)}}
function render(){const s=Math.ceil(left/1000),a=left/3600000*Math.PI*2,r=133,x=180+r*Math.sin(a),y=180-r*Math.cos(a);$('sector').setAttribute('d',left>=3600000?'M180 47 A133 133 0 1 1 179.99 47 Z':left<=0?'':`M180 180 L180 47 A133 133 0 ${a>Math.PI?1:0} 1 ${x} ${y} Z`);$('handle').setAttribute('transform',`rotate(${a*180/Math.PI} 180 180)`);const t=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('time').textContent=t;document.title=t+' · 파란 다이얼';$('dial').setAttribute('aria-valuenow',Math.round(left/60000));$('dial').setAttribute('aria-valuetext',Math.floor(s/60)+'분 '+s%60+'초');$('start').textContent=running?'일시정지':left===0?'다시 시작하기':left<total?'계속하기':'시작하기'}
function stop(){clearInterval(interval);running=false}function setMinutes(m){setDuration(Math.max(1,Math.min(60,m))*60)}
function setDuration(seconds){stop();total=seconds*1000;left=total;$('setMin').value=Math.floor(seconds/60);$('setSec').value=seconds%60;$('status').textContent=Math.floor(seconds/60)+'분 '+seconds%60+'초로 맞췄어요';render()}
function applyTime(){const m=Number($('setMin').value),s=Number($('setSec').value);if(!Number.isInteger(m)||!Number.isInteger(s)||m<0||m>60||s<0||s>59||m*60+s<1||m*60+s>3600){$('status').textContent='1초부터 60분까지 입력해 주세요. 초는 0~59예요.';return}setDuration(m*60+s)}$('apply').onclick=applyTime;['setMin','setSec'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')applyTime()}));function beep(){if(!audio)return;[0,.4,.8].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+d;o.connect(g);g.connect(audio.destination);o.frequency.value=740;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)})}
function tick(){left=Math.max(0,end-Date.now());if(!left){stop();$('status').textContent='시간이 끝났어요. 수고하셨어요!';beep()}render()}
$('start').onclick=()=>{if(running){left=Math.max(0,end-Date.now());stop();$('status').textContent='잠시 멈췄어요';render();return}if(!left)left=total;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}running=true;end=Date.now()+left;interval=setInterval(tick,100);$('status').textContent='지금은 온전히 집중하는 시간';render()};$('reset').onclick=()=>{stop();left=total;$('status').textContent='처음 설정한 시간으로 돌아왔어요';render()};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>setMinutes(Number(b.dataset.min)));
function point(e){const rect=$('dial').getBoundingClientRect(),x=e.clientX-rect.left-rect.width/2,y=e.clientY-rect.top-rect.height/2;if(Math.hypot(x,y)<rect.width*.06)return;let a=Math.atan2(x,-y);if(a<0)a+=Math.PI*2;setMinutes(Math.max(1,Math.round(a/(Math.PI*2)*60)))}
$('dial').onpointerdown=e=>{drag=true;$('dial').setPointerCapture(e.pointerId);point(e)};$('dial').onpointermove=e=>{if(drag)point(e)};$('dial').onpointerup=()=>drag=false;$('dial').onpointercancel=()=>drag=false;$('dial').onkeydown=e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();setMinutes(e.key==='Home'?1:e.key==='End'?60:Math.round(left/60000)+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1))}};document.addEventListener('visibilitychange',()=>{if(running)tick()});render();
</script></html>
